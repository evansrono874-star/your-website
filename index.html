<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event & Campaign Landing Page</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; border-radius: 16px; padding: 40px 30px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 24px; color: #1d1d1f; margin-bottom: 12px; }
        p { color: #86868b; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: inline-block; width: 100%; background-color: #0071e3; color: #ffffff; font-weight: 600; padding: 14px 0; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Event</h1>
        <p>Get your tickets and join us for an exclusive experience.</p>
        <a href="#" class="btn">Get Tickets Now</a>
    </div>
</body>
</html>
